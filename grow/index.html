<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<meta name="description" content="Grow to your full height: stretching, posture, workouts, food, sleep and progress tracking">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rise · Grow Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tokens: dark is the default; light comes from the system or the Settings switch */
:root{
  --bg:#0a0f1a; --bg2:#101828; --card:#141d2e; --card2:#1b263a; --line:rgba(255,255,255,.09);
  --ink:#eef3fb; --muted:#93a0b8; --faint:rgba(255,255,255,.05);
  --ac:#2dd4bf; --ac2:#22d3ee; --ac-ink:#04201c;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --f-d:"Sora",ui-sans-serif,system-ui,sans-serif; --f-b:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --fs:15px; --r:20px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f6fb; --bg2:#e8eef7; --card:#ffffff; --card2:#f1f5fa; --line:rgba(10,20,40,.09);
  --ink:#0d1626; --muted:#5b6880; --faint:rgba(10,20,40,.04); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f6fb; --bg2:#e8eef7; --card:#ffffff; --card2:#f1f5fa; --line:rgba(10,20,40,.09);
  --ink:#0d1626; --muted:#5b6880; --faint:rgba(10,20,40,.04); color-scheme:light}
:root[data-accent="violet"]{--ac:#a78bfa;--ac2:#818cf8;--ac-ink:#160b33}
:root[data-accent="sunset"]{--ac:#fb923c;--ac2:#f472b6;--ac-ink:#2a0e04}
:root[data-accent="ocean"]{--ac:#60a5fa;--ac2:#38bdf8;--ac-ink:#04162b}
:root[data-accent="lime"]{--ac:#a3e635;--ac2:#4ade80;--ac-ink:#132004}
:root[data-size="s"]{--fs:14px} :root[data-size="l"]{--fs:16.5px} :root[data-size="xl"]{--fs:18px}

*{box-sizing:border-box} [hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:var(--fs);line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(80% 100% at 80% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),radial-gradient(70% 90% at 0% 0%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.02em}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.top .hi{color:var(--muted);font-size:.86em;font-weight:600}
.top h1{font-size:1.65em;font-weight:800;line-height:1.1}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* Cards and basics */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:1.02em;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-family:var(--f-b);font-weight:600;color:var(--muted);font-size:.8em}
.sec{font-family:var(--f-d);font-weight:700;font-size:1.1em;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:var(--f-b);color:var(--muted);font-weight:600;font-size:.75em}
.muted{color:var(--muted)} .small{font-size:.85em} .tiny{font-size:.76em}
.row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:15px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-ink);box-shadow:0 8px 24px -10px var(--ac)}
.btn.block{width:100%} .btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:.9em}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,var(--card2));color:var(--bad);box-shadow:none}
.btn:active,.tap:active{transform:scale(.97)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--faint);border:1px solid var(--line);font-size:.78em;font-weight:600;color:var(--muted)}
.pill.ac{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 30%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88em;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:.88em;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 0 var(--line) inset}

/* Hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 18%,var(--card)),var(--card) 60%)}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-d);font-size:1.7em;font-weight:800;display:block;line-height:1}
.ring span{font-size:.72em;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-d);font-size:1.25em;font-weight:800}
.stat{font-size:.82em;color:var(--muted)}
.stat b{color:var(--ink);display:block}

/* Habits */
.habit{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.habit .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.2em;background:var(--card2);flex:none}
.habit .t{flex:1;min-width:0} .habit .t b{display:block;font-weight:700;font-size:.95em} .habit .t span{font-size:.8em;color:var(--muted)}
.check{width:32px;height:32px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.check.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.check svg{width:18px;height:18px;opacity:0} .check.on svg{opacity:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:1.1em}
.stepper b{min-width:40px;text-align:center;font-family:var(--f-d)}
.drops{display:flex;gap:4px;margin-top:6px}
.drops i{flex:1;height:6px;border-radius:3px;background:var(--card2)} .drops i.on{background:var(--ac2)}

/* Bars */
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.nut{margin:10px 0} .nut .row{font-size:.86em} .nut b{font-weight:700}

/* Routine cards */
.rt{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.rt .em{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:1.6em;flex:none}
.rt b{font-family:var(--f-d);font-size:1em;display:block} .rt span{font-size:.8em;color:var(--muted)}
.rt .go{margin-left:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.feature{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-ink);border:0}
.feature .muted,.feature span{color:color-mix(in srgb,var(--ac-ink) 75%,transparent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;text-align:center;font-size:.72em;color:var(--muted);font-weight:600}
.week button b{display:block;font-size:1.25em;margin-top:2px}
.week button.today{border-color:var(--ac);color:var(--ink)}
.week button.done{background:color-mix(in srgb,var(--ac) 18%,var(--card))}

/* Foods */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:none;height:100%}
.food{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .em{font-size:1.5em;width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;flex:none}
.food .t{flex:1;min-width:0} .food .t b{display:block;font-size:.94em} .food .t span{font-size:.76em;color:var(--muted)}
.add{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:800;font-size:1.2em;flex:none}
.cnt{font-family:var(--f-d);font-weight:800;color:var(--ac);min-width:22px;text-align:center}
.meal{padding:12px 0;border-top:1px solid var(--line)} .meal:first-of-type{border-top:0}
.meal small{font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.06em;font-size:.7em}
.meal p{margin:3px 0 0}

/* Progress */
.big{font-family:var(--f-d);font-size:2.4em;font-weight:800;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.bars7{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars7 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.7em;color:var(--muted)}
.bars7 i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--ac2),var(--ac));min-height:4px}
.bars7 i.zero{background:var(--card2)}
.art{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.art:first-of-type{border-top:0}
.art .em{font-size:1.3em;width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.art b{display:block;font-size:.94em}

/* Settings */
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);min-height:52px}
.set:first-of-type{border-top:0}
.set .t{flex:1} .set .t b{display:block;font-weight:600;font-size:.95em} .set .t span{font-size:.78em;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--ac);border-color:var(--ac)} .sw.on::after{left:23px;background:#fff}
.sel{background:var(--card2);border:1px solid var(--line);border-radius:11px;height:38px;padding:0 10px;max-width:46%}
.sel option{background:var(--card);color:var(--ink)}
.swatches{display:flex;gap:10px}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
input[type=time].sel{width:auto}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.7em;font-weight:700;color:var(--muted)}
.tabs svg{width:23px;height:23px}
.tabs button.on{color:var(--ac)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet{visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:1.35em;margin-bottom:6px}
.field{margin:14px 0} .field label{display:block;font-weight:600;font-size:.85em;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px;outline:none}
.input:focus{border-color:var(--ac)}
.inputs{display:flex;gap:10px} .inputs .input{flex:1}
.opt{display:flex;gap:8px} .opt button{flex:1;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700}
.opt button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac)}
.exl{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)} .exl:first-of-type{border-top:0}
.exl .n{width:28px;height:28px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:.8em;font-weight:700;flex:none;color:var(--muted)}
.exl b{display:block;font-size:.94em} .exl span{font-size:.8em;color:var(--muted)}
.prose p{margin:0 0 12px;color:var(--ink)} .prose ul{margin:0 0 12px;padding-left:20px} .prose li{margin:4px 0}

/* Player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.player::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 70%);pointer-events:none}
.player>*{position:relative}
.pl-top{display:flex;align-items:center;justify-content:space-between;max-width:520px;width:100%;margin:0 auto}
.pl-prog{display:flex;gap:4px;max-width:520px;width:100%;margin:14px auto 0}
.pl-prog i{flex:1;height:4px;border-radius:2px;background:var(--card2)} .pl-prog i.on{background:var(--ac)} .pl-prog i.cur{background:var(--ac2)}
.pl-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:520px;width:100%;margin:0 auto}
.pl-phase{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.75em;color:var(--ac)}
.pl-name{font-size:1.8em;font-weight:800;margin:8px 0 6px}
.pl-cue{color:var(--muted);max-width:360px;min-height:3em}
.timer{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:22px 0}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:3.6em;font-weight:800}
.pl-next{color:var(--muted);font-size:.86em}
.pl-ctl{display:flex;justify-content:center;align-items:center;gap:22px;max-width:520px;width:100%;margin:0 auto}
.pl-ctl .r{width:58px;height:58px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.pl-ctl .p{width:84px;height:84px;border-radius:28px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-ink);display:grid;place-items:center;box-shadow:0 14px 34px -12px var(--ac)}
.pl-ctl svg{width:26px;height:26px}

/* Onboarding */
.ob{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
.ob .wrap{padding-bottom:40px;min-height:100%;display:flex;flex-direction:column}
.ob .dots{display:flex;gap:6px;margin:6px 0 30px} .ob .dots i{height:5px;flex:1;border-radius:3px;background:var(--card2)} .ob .dots i.on{background:var(--ac)}
.ob h1{font-size:2em;font-weight:800;line-height:1.1;margin-bottom:10px}
.ob .logo{width:84px;height:84px;border-radius:26px;margin:20px 0 26px;box-shadow:0 18px 40px -14px var(--ac)}
.ob .grow{flex:1}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:16px;padding:12px 14px;font-size:.86em}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:.9em;opacity:0;transition:.25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:18px 6px;color:var(--muted);font-size:.9em}
.confetti{font-size:4em;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="hi" id="hi"></div><h1 id="title">Today</h1></div>
    <button class="iconbtn tap" data-act="logHeight" aria-label="Log height" id="topBtn"></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="player" id="player" hidden></div>
<div class="ob" id="ob" hidden></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- Icons ---------- */
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>',

function dayFood(k){ const f=peekDay(k).food, t={p:0,ca:0,d:0,zn:0,k:0}; for(const id in f){ const it=FOODS.find(x=>x.id===id); if(!it) continue; for(const n in t) t[n]+=it[n]*f[id]; } return t; }
function autoChecks(k=dkey()){
  const d=peekDay(k), t=targets(), f=dayFood(k), c=Object.assign({},d.checks);
  if(d.sleep!=null && d.sleep>=sleepRange()[0]) c.sleep=true;
  if(d.workouts.length) c.workout=true;
  if(f.p>=t.p) c.protein=true;
  if(f.ca>=t.ca) c.calcium=true;
  if(d.water>=S.settings.waterGoal) c.water=true;
  return c;
}
function activeHabits(){ return Object.keys(HABITS).filter(h=>S.settings.habits[h]); }
function score(k=dkey()){ const hs=activeHabits(); if(!hs.length) return 0; const c=autoChecks(k); return Math.round(hs.filter(h=>c[h]).length/hs.length*100); }
function streak(){ let n=0, d=new Date(); if(score(dkey(d))<50) d=addDays(d,-1); while(score(dkey(d))>=50 && n<999){ n++; d=addDays(d,-1); } return n; }

/* ---------- UI helpers ---------- */
let tab = "today", foodSeg = "track", foodFilter = "all", foodQ = "", mealDay = new Date().getDay();
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),1800); }
function buzz(p){ if(S.settings.haptics && navigator.vibrate) try{navigator.vibrate(p)}catch(e){} }
let actx;
function beep(f=880,ms=120,v=.15){ if(!S.settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type="sine"; g.gain.setValueAtTime(v,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ms/1000); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+ms/1000);}catch(e){} }
function ringSvg(pct,size=112,sw=11,col="url(#rg)"){
  const r=(size-sw)/2, c=2*Math.PI*r;
  return `<svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,pct/100))}" style="transition:stroke-dashoffset .5s"/></svg>`;
}
const rtMins = id => Math.max(1,Math.round((RT[id].ex.reduce((a,e)=>a+EX[e].t,0) + RT[id].ex.length*S.settings.rest)/60));
function applyLook(){
  const r=document.documentElement, s=S.settings;
  if(s.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",s.theme);
  if(s.accent==="teal") r.removeAttribute("data-accent"); else r.setAttribute("data-accent",s.accent);
  r.setAttribute("data-size",s.size);
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=getComputedStyle(r).getPropertyValue("--bg").trim()||"#0a0f1a";
}

function vToday(){

  const sr=sleepRange(), evening=new Date().getHours()>=19;

    const H=HABITS[h]; let right, sub=H.s;
    if(h==="water"){ sub=`${d.water} of ${S.settings.waterGoal} glasses`; right=`<div class="stepper"><button data-act="water" data-v="-1" aria-label="Less water">−</button><b>${d.water}</b><button data-act="water" data-v="1" aria-label="More water">+</button></div>`; }
    else if(h==="sleep"){ sub = d.sleep!=null ? `${d.sleep} h logged · goal ${sr[0]}–${sr[1]} h` : `Goal ${sr[0]}–${sr[1]} h · tap to log`; right=`<button class="check ${c[h]?"on":""}" data-act="sleepSheet" aria-label="Log sleep">${I.check}</button>`; }
    else if(h==="protein") { sub=`${Math.round(f.p)} / ${t.p} g`; right=`<span class="check ${c[h]?"on":""}" aria-hidden="true">${I.check}</span>`; }

    else right=`<button class="check ${c[h]?"on":""}" data-act="check" data-v="${h}" aria-label="Mark ${esc(H.n)}">${I.check}</button>`;

    <div><span>${evening?"Tonight":"Today's workout"}</span><b style="font-size:1.1em">${evening?RT.night.n:r.n}</b><span>${rtMins(evening?"night":pl.r)} min · ${(evening?RT.night:r).ex.length} moves</span></div>
    <div class="go" style="background:rgba(255,255,255,.3)">${I.play.replace('<svg','<svg width="18" height="18"')}</div>
  </button>

  <div class="sec">Daily habits <small>${activeHabits().filter(h=>c[h]).length}/${activeHabits().length} done</small></div>

function nutBar(n,v,goal,u){ const p=Math.min(100,Math.round(v/goal*100)); return `<div class="nut"><div class="row between"><b>${n}</b><span class="muted">${Math.round(v)} / ${goal} ${u}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`; }

function heightChart(){
  const pts=S.heights.slice(-30);
  if(pts.length<2) return `<div class="empty">Your height chart appears after two measurements.<br>Tip: measure in the morning, barefoot, against a wall.</div>`;
  const W=320,H=150,pad=24,pl=50, xs=pts.map(p=>new Date(p.date).getTime()), ys=pts.map(p=>p.cm);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(y1-y0<2){ y0-=1; y1+=1; }
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const X=t=>pl+(t-x0)/((x1-x0)||1)*(W-pl-pad), Y=v=>H-pad-(v-y0)/(y1-y0)*(H-pad*2);
  const path=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.cm).toFixed(1)).join(" ");
  const area=path+` L${X(xs[xs.length-1]).toFixed(1)} ${H-pad} L${X(xs[0]).toFixed(1)} ${H-pad} Z`;
  const f=d=>new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Height over time"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W-pad}" y1="${Y(y1)}" y2="${Y(y1)}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pad}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="var(--line)"/>
    <text x="${pl-8}" y="${Y(y1)+3}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtH(y1)}</text><text x="${pl-8}" y="${Y(y0)+3}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtH(y0)}</text>
    <path d="${area}" fill="url(#hg)"/><path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.cm).toFixed(1)}" r="3.5" fill="var(--bg)" stroke="var(--ac)" stroke-width="2"/>`).join("")}
    <text x="${W-pad}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="end" dy="2">${f(pts[pts.length-1].date)}</text><text x="${pl}" y="${H-4}" fill="var(--muted)" font-size="10">${f(pts[0].date)}</text></svg>`;
}

/* ---------- Sheets ---------- */
function openSheet(html){ $("#sheetBody").innerHTML=html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
function heightInputs(cm,id="h"){
  if(S.settings.units==="metric") return `<div class="inputs"><input class="input" id="${id}cm" type="number" inputmode="decimal" step="0.1" min="50" max="250" placeholder="cm" value="${cm!=null?Math.round(cm*10)/10:""}"></div>`;
  const tin=cm!=null?cm/2.54:null, ft=tin!=null?Math.floor(tin/12):"", inch=tin!=null?Math.round((tin-ft*12)*10)/10:"";
  return `<div class="inputs"><input class="input" id="${id}ft" type="number" inputmode="numeric" min="1" max="8" placeholder="ft" value="${ft}"><input class="input" id="${id}in" type="number" inputmode="decimal" step="0.1" min="0" max="11.9" placeholder="in" value="${inch}"></div>`;
}
function readHeight(id="h"){
  if(S.settings.units==="metric"){ const v=parseFloat(($("#"+id+"cm")||{}).value); return v>=50&&v<=250?v:null; }
  const ft=parseFloat(($("#"+id+"ft")||{}).value)||0, inch=parseFloat(($("#"+id+"in")||{}).value)||0, cm=(ft*12+inch)*2.54;
  return cm>=50&&cm<=250?cm:null;
}
function readWeight(id){ const v=parseFloat(($("#"+id)||{}).value); if(!(v>0)) return null; const kg=S.settings.units==="metric"?v:v/2.20462; return kg>=15&&kg<=300?kg:null; }
const wVal = kg => kg==null?"":S.settings.units==="metric"?Math.round(kg*10)/10:Math.round(kg*2.20462);

/* ---------- Workout player ---------- */
let P=null, wakeLock=null;
function startRt(id){
  closeSheet();
  const r=RT[id]; let ex=r.ex.slice();
  if(S.profile && !S.profile.bar) ex=ex.map(e=>e==="hang"?"reach":e==="kneeraise"?"deadbug":e);
  P={id,ex,i:0,phase:"prep",left:S.settings.prep,total:S.settings.prep,paused:false,last:Date.now()};
  $("#player").hidden=false; document.body.style.overflow="hidden";
  if(S.settings.awake && navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{});
  drawPlayer(); P.tick=setInterval(tick,200);
}
function tick(){
  if(!P||P.paused||P.phase==="done") { if(P) P.last=Date.now(); return; }
  const now=Date.now(); P.left-=(now-P.last)/1000; P.last=now;
  const s=Math.ceil(P.left);
  if(s!==P.shown){ P.shown=s; if(s<=3&&s>0) beep(660,90); }
  if(P.left<=0) advance(); else updTimer();
}
function advance(dir=1){
  const rest=S.settings.rest;
  if(dir<0){ P.i=Math.max(0,P.phase==="work"&&P.left>P.total-2?P.i-1:P.i); setPhase("work"); return; }
  if(P.phase==="prep") setPhase("work");
  else if(P.phase==="work"){ if(P.i>=P.ex.length-1) return finish(); if(rest>0) setPhase("rest"); else { P.i++; setPhase("work"); } }
  else if(P.phase==="rest"){ P.i++; setPhase("work"); }
}
function setPhase(ph){
  P.phase=ph; P.total=ph==="work"?EX[P.ex[P.i]].t:ph==="rest"?S.settings.rest:S.settings.prep; P.left=P.total; P.last=Date.now(); P.shown=null;
  if(ph==="work"){ beep(990,220,.2); buzz([60,40,60]); } else if(ph==="rest"){ beep(520,160); buzz(40); }
  drawPlayer();
}
function finish(){
  clearInterval(P.tick); P.phase="done";
  const d=day(); if(!d.workouts.includes(P.id)) d.workouts.push(P.id); save();
  beep(880,120); setTimeout(()=>beep(1175,200),140); buzz([80,60,80,60,160]);
  drawPlayer();
}
function closePlayer(){ if(P) clearInterval(P.tick); P=null; $("#player").hidden=true; document.body.style.overflow=""; if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } render(); }
function drawPlayer(){
  const el=$("#player"), r=RT[P.id];
  if(P.phase==="done"){
    el.innerHTML=`<div class="pl-top"><span></span><button class="iconbtn" data-act="closePlayer" aria-label="Close">${I.x}</button></div>
    <div class="pl-mid"><div class="confetti">🎉</div><h1 class="pl-name">Workout complete!</h1><p class="pl-cue">${r.n} · ${P.ex.length} moves · about ${rtMins(P.id)} minutes. Stand tall — you earned it.</p>
    <div class="stat" style="margin:16px 0"><b>🔥 ${streak()}</b>day streak</div></div>
    <div class="pl-ctl"><button class="btn block" data-act="closePlayer">Done</button></div>`;
    return;
  }
  const e=EX[P.ex[P.i]], nx=P.phase==="rest"?EX[P.ex[P.i+1]]:EX[P.ex[P.i+1]];
  const showEx = P.phase==="rest" ? EX[P.ex[P.i+1]] : e;
  el.innerHTML=`<div class="pl-top"><button class="iconbtn" data-act="closePlayer" aria-label="Quit workout">${I.x}</button><div class="small muted" style="font-weight:700">${r.em} ${r.n}</div><div class="small muted" style="width:42px;text-align:right">${P.i+1}/${P.ex.length}</div></div>
  <div class="pl-prog">${P.ex.map((_,i)=>`<i class="${i<P.i?"on":i===P.i?"cur":""}"></i>`).join("")}</div>
  <div class="pl-mid">
    <div class="pl-phase">${P.phase==="prep"?"Get ready":P.phase==="rest"?"Rest · up next":"Go"}</div>
    <h1 class="pl-name">${showEx.n}</h1>
    <div class="timer"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--card2)" stroke-width="9"/><circle id="tc" cx="60" cy="60" r="54" fill="none" stroke="${P.phase==="work"?"var(--ac)":"var(--muted)"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg><div class="v" id="tv"></div></div>
    <p class="pl-cue">${showEx.c}</p>
    <div class="pl-next">${P.phase==="work"&&nx?"Next: "+nx.n:P.phase==="work"?"Last move!":""}</div>
  </div>
  <div class="pl-ctl"><button class="r" data-act="plPrev" aria-label="Previous">${I.prev}</button><button class="p" data-act="plPause" aria-label="${P.paused?"Resume":"Pause"}" id="pp">${P.paused?I.play:I.pause}</button><button class="r" data-act="plNext" aria-label="Skip">${I.next}</button></div>`;
  updTimer();
}
function updTimer(){ const tv=$("#tv"), tc=$("#tc"); if(!tv) return; tv.textContent=Math.max(0,Math.ceil(P.left)); tc.setAttribute("stroke-dashoffset",(339.3*(1-Math.max(0,P.left)/P.total)).toFixed(1)); }

/* ---------- Onboarding ---------- */

  if(OB.step===0) b=`<img class="logo" src="icon-192.png" alt=""><h1>Reach your full height.</h1><p class="muted">Rise builds the daily habits that matter for growth: stretching, posture, jumping, the right food and deep sleep — and tracks your progress.</p>

    <div class="grow"></div><button class="btn block" data-act="obNext">Get started</button>`;
  else if(OB.step===1) b=`<h1>About you</h1><p class="muted">Used to set your sleep, nutrition and growth targets.</p>

    <div class="grow"></div><button class="btn block" data-act="obNext">Continue</button>`;
  else if(OB.step===2) b=`<h1>Your size</h1><p class="muted">Pick units, then enter your height and weight.</p>
    <div class="field"><label>Units</label><div class="opt"><button class="${S.settings.units==="metric"?"on":""}" data-act="obUnits" data-v="metric">cm · kg</button><button class="${S.settings.units==="imperial"?"on":""}" data-act="obUnits" data-v="imperial">ft/in · lb</button></div></div>
    <div class="field"><label>Height</label>${heightInputs(OB.h??null)}</div>
    <div class="field"><label>Weight (${S.settings.units==="metric"?"kg":"lb"})</label><input class="input" id="ow" type="number" inputmode="decimal" step="0.1" value="${wVal(OB.w??null)}"></div>
    <div class="grow"></div><button class="btn block" data-act="obNext">Continue</button>`;
  else b=`<h1>Almost done</h1><p class="muted">Parents' heights give you a genetic height estimate. Skip if you don't know them.</p>
    <div class="field"><label>Father's height</label>${heightInputs(OB.fa??null,"fa")}</div>
    <div class="field"><label>Mother's height</label>${heightInputs(OB.mo??null,"mo")}</div>
    <div class="field"><label>Do you have a pull-up bar?</label><div class="opt"><button class="${OB.bar?"on":""}" data-act="obBar" data-v="1">Yes</button><button class="${!OB.bar?"on":""}" data-act="obBar" data-v="0">No</button></div><div class="tiny muted" style="margin-top:6px">Without one, hanging moves are swapped for floor versions.</div></div>
    <div class="grow"></div><button class="btn block" data-act="obNext">Start Rise</button>`;
  el.innerHTML=`<div class="wrap">${OB.step?`<button class="iconbtn" data-act="obBack" aria-label="Back" style="margin-bottom:14px;transform:scaleX(-1)">${I.chev}</button>`:""}${dots}${b}</div>`;
}
function obCollect(){
  if(OB.step===1){ OB.name=$("#oname").value.trim(); OB.age=parseInt($("#oage").value,10); }
  if(OB.step===2){ OB.h=readHeight(); OB.w=readWeight("ow"); }
  if(OB.step===3){ OB.fa=readHeight("fa"); OB.mo=readHeight("mo"); }
}
function obNext(){
  obCollect();
  if(OB.step===1 && !(OB.age>=6 && OB.age<=80)) return toast("Enter your age (6–80)");
  if(OB.step===2 && !OB.h) return toast("Enter your height");
  if(OB.step<3){ OB.step++; onboard(); return; }
  S.profile={name:OB.name||"",age:OB.age,ageSet:new Date().toISOString(),sex:OB.sex,heightCm:OB.h,weightKg:OB.w,father:OB.fa,mother:OB.mo,bar:OB.bar};
  S.heights=[{date:dkey(),cm:OB.h}]; if(OB.w) S.weights=[{date:dkey(),kg:OB.w}];
  save(); $("#ob").hidden=true; render(); toast("Welcome to Rise 🌱");
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case "tab": tab=v; render(); window.scrollTo(0,0); break;
    case "check": { const d=day(); d.checks[v]=!d.checks[v]; save(); buzz(15); render(); break; }
    case "water": { const d=day(); d.water=Math.max(0,Math.min(20,d.water+(+v))); save(); buzz(10); render(); if(+v>0&&d.water===S.settings.waterGoal) toast("Water goal hit 💧"); break; }
    case "sleepSheet": sleepSheet(); break;
    case "setSleep": { day().sleep = v===""?null:+v; save(); closeSheet(); render(); break; }
    case "food": { const d=day(), id=el.dataset.id; d.food[id]=Math.max(0,(d.food[id]||0)+(+v)); if(!d.food[id]) delete d.food[id]; save(); buzz(10); render(); if(+v>0) toast("Added "+FOODS.find(x=>x.id===id).n); break; }
    case "foodSeg": foodSeg=v; render(); break;
    case "foodFilter": foodFilter=v; render(); break;
    case "mealDay": mealDay=+v; render(); break;
    case "rtSheet": rtSheet(v); break;
    case "startRt": startRt(v); break;
    case "learn": learnSheet(v); break;
    case "closeSheet": closeSheet(); break;
    case "logHeight": logHeightSheet(); break;
    case "saveHeight": { const cm=readHeight(), dt=$("#hdate").value||dkey(); if(!cm) return toast("Enter a valid height"); S.heights=S.heights.filter(x=>x.date!==dt); S.heights.push({date:dt,cm}); S.heights.sort((x,y)=>x.date<y.date?-1:1); save(); closeSheet(); render(); toast("Height saved 📏"); break; }
    case "delHeight": S.heights=S.heights.filter(x=>x.date!==v); save(); logHeightSheet(); render(); break;
    case "weightSheet": weightSheet(); break;
    case "saveWeight": { const kg=readWeight("wv"); if(!kg) return toast("Enter a valid weight"); S.weights=S.weights.filter(x=>x.date!==dkey()); S.weights.push({date:dkey(),kg}); save(); closeSheet(); render(); break; }
    case "profileSheet": profileSheet(); break;
    case "pick": el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el)); break;
    case "saveProfile": {
      const ag=parseInt($("#page").value,10); if(!(ag>=6&&ag<=80)) return toast("Enter your age (6–80)");
      const p=S.profile||{};
      Object.assign(p,{name:$("#pname").value.trim(),sex:$("#psex .on").dataset.v,bar:$("#pbar .on").dataset.v==="1",father:readHeight("fa"),mother:readHeight("mo")});
      if(ag!==age()){ p.age=ag; p.ageSet=new Date().toISOString(); }
      S.profile=p; save(); closeSheet(); render(); toast("Profile saved"); break;
    }
    case "toggle": {
      const s=S.settings;
      if(v.startsWith("habit:")) s.habits[v.slice(6)]=!s.habits[v.slice(6)];
      else if(v.startsWith("rem.")){ const k=v.slice(4); s.rem[k]=!s.rem[k]; if(k==="on"&&s.rem.on) askNotify(); }
      else s[v]=!s[v];
      save(); render(); break;
    }
    case "accent": S.settings.accent=v; save(); applyLook(); render(); break;
    case "install": if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{installEvt=null; render();}); } break;
    case "howInstall": installHelp(); break;
    case "export": {
      const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}), u=URL.createObjectURL(blob), l=document.createElement("a");
      l.href=u; l.download="rise-backup-"+dkey()+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast("Backup saved"); break;
    }
    case "reset": if(confirm("Delete all Rise data on this phone? This can't be undone.")){ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); } break;
    case "plPause": P.paused=!P.paused; P.last=Date.now(); $("#pp").innerHTML=P.paused?I.play:I.pause; break;
    case "plNext": if(P.phase==="work"&&P.i>=P.ex.length-1) finish(); else advance(); break;
    case "plPrev": advance(-1); break;
    case "closePlayer": if(P&&P.phase!=="done"&&P.i>0&&!confirm("Quit this workout?")) break; closePlayer(); break;
    case "obNext": obNext(); break;
    case "obBack": obCollect(); OB.step=Math.max(0,OB.step-1); onboard(); break;
    case "obSex": OB.sex=v; obCollect(); onboard(); break;
    case "obBar": OB.bar=v==="1"; obCollect(); onboard(); break;
    case "obUnits": obCollect(); S.settings.units=v; onboard(); break;
  }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="importFile" && el.files[0]){
    el.files[0].text().then(t=>{ const d=JSON.parse(t); if(!d||typeof d!=="object"||!("days" in d)) throw 0; localStorage.setItem(KEY,JSON.stringify(d)); S=load(); applyLook(); render(); toast("Backup restored"); }).catch(()=>toast("That file isn't a Rise backup"));
    return;
  }
  const k=el.dataset.set; if(!k) return;
  let val=el.value; if(/^\d+$/.test(val)) val=+val;
  if(k.startsWith("rem.")) S.settings.rem[k.slice(4)]=val; else S.settings[k]=val;
  save(); applyLook(); render();
});
document.addEventListener("input", e=>{
  if(e.target.id==="foodQ"){ foodQ=e.target.value; const q=foodQ.trim().toLowerCase(); const list=FOODS.filter(x=>(foodFilter==="all"||x.tg.includes(foodFilter))&&(!q||x.n.toLowerCase().includes(q))); $("#foodList").innerHTML=list.length?list.map(foodRow).join(""):'<div class="empty">No foods match.</div>'; }
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(P&&S.settings.awake&&navigator.wakeLock&&!wakeLock) navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{}); if(!P) render(); } else if(wakeLock){ wakeLock=null; } });
window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",applyLook);

/* ---------- Reminders ---------- */
function askNotify(){ if(!("Notification" in window)) return toast("Notifications aren't supported here"); Notification.requestPermission().then(p=>{ if(p!=="granted"){ toast("Allow notifications in phone settings"); } }); }
function notify(title,body){
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  const opt={body,icon:"icon-192.png",badge:"icon-192.png",vibrate:[80,40,80]};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)).catch(()=>{ try{new Notification(title,opt)}catch(e){} });
  else try{ new Notification(title,opt); }catch(e){}
}
function checkReminders(){
  const r=S.settings.rem; if(!r.on||!S.profile) return;
  const now=new Date(), hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"), k=dkey();
  let fired; try{ fired=JSON.parse(localStorage.getItem("rise.fired")||"{}"); }catch(e){ fired={}; }
  if(fired.day!==k) fired={day:k};
  const once=(id,cond,t,b)=>{ if(cond&&!fired[id]){ fired[id]=1; notify(t,b); } };
  once("workout", hm>=r.workout && !peekDay(k).workouts.length, "Time to train 💪", RT[PLAN[now.getDay()].r].n+" · "+rtMins(PLAN[now.getDay()].r)+" min");
  once("bed", hm>=r.bed, "Wind down for growth 🌙", "Screens off soon. Try the 6-minute bedtime routine.");
  if(r.water && now.getHours()>=9 && now.getHours()<=21 && now.getHours()%2===1) once("w"+now.getHours(), peekDay(k).water<S.settings.waterGoal, "Drink some water 💧", peekDay(k).water+" of "+S.settings.waterGoal+" glasses so far");
  try{ localStorage.setItem("rise.fired",JSON.stringify(fired)); }catch(e){}
}

/* ---------- Boot ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; if(tab==="set") render(); });
applyLook();
if(!S.profile) onboard(); else render();
setInterval(checkReminders,30000); checkReminders();
let lastDay=dkey(); setInterval(()=>{ if(dkey()!==lastDay){ lastDay=dkey(); if(!P) render(); } },60000);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
